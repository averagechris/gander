image: nixos/unstable
arch: x86_64
oauth: git.sr.ht/OBJECTS:RW git.sr.ht/PROFILE:RO git.sr.ht/REPOSITORIES:RO builds.sr.ht/JOBS:RW builds.sr.ht/SECRETS:RO
environment:
  NIX_CONFIG: "experimental-features = nix-command flakes"
sources:
  - https://git.sr.ht/~averagechris/gander
tasks:
  - release-artifact: |
      cd gander
      nix build .#release-artifact --out-link result-release-artifact
      mkdir -p ~/artifacts
      cp -p result-release-artifact/* ~/artifacts/
  - upload-and-refresh: |
      cd gander
      hut() { nix shell nixpkgs#hut --command hut "$@"; }
      version="$(awk '/^\[package\]/{s=1} s && /^version = /{gsub(/"/,"",$3); print $3; exit}' Cargo.toml)"
      tag="v${version#v}"
      commit="$(git rev-parse HEAD)"

      # jobs with an oauth grant get ~/.config/hut/config pre-provisioned

      for artifact in result-release-artifact/*.tar.gz; do
        hut git artifact upload -r gander --rev "$tag" "$artifact" "$artifact.sha256"
      done

      manifest="$(mktemp)"
      cat > "$manifest" <<EOF
      image: nixos/unstable
      arch: x86_64
      oauth: pages.sr.ht/PAGES:RW
      environment:
        NIX_CONFIG: "experimental-features = nix-command flakes"
        TRIGGER_SOURCE: release
        TRIGGER_PROJECT: gander
        TRIGGER_TAG: $tag
        TRIGGER_SHA: $commit
      sources:
        - https://git.sr.ht/~averagechris/averagechris.srht.site
      tasks:
        - refresh: |
            cd averagechris.srht.site
            nix run .#refresh-pages
      EOF
      hut builds submit "$manifest" --note "site refresh: gander $tag" --visibility unlisted
artifacts:
  - artifacts/gander-v0.5.0-x86_64-linux.tar.gz
  - artifacts/gander-v0.5.0-x86_64-linux.tar.gz.sha256
