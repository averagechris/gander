[package]
name = "gander"
version = "0.1.0"
edition = "2024"
description = "Take a gander at your jj changes: a fast review TUI with durable viewed-state, comments, and exportable review artifacts"
license = "MIT OR Apache-2.0"
repository = "https://git.sr.ht/~averagechris/gander"
homepage = "https://git.sr.ht/~averagechris/gander"
readme = "README.md"
keywords = ["jj", "jujutsu", "code-review", "tui", "diff"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.51", features = ["derive", "env"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
globset = "0.4.18"
ratatui = "0.30.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
toml = "0.8.23"
tree-sitter = "0.25.10"
tree-sitter-bash = "0.25.1"
tree-sitter-css = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-highlight = "0.25.10"
tree-sitter-html = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-md = "0.5.3"
tree-sitter-nix = "0.3.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.0"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
uuid = { version = "1.23.4", features = ["v4"] }
wait-timeout = "0.2.1"

[dev-dependencies]
insta = { version = "1.44.0", features = ["json"] }
tempfile = "3.23.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
