[package]
name = "jj-change-viewer"
version = "0.1.0"
edition = "2024"
description = "Fast, ergonomic TUI for reviewing jj changes and exporting review artifacts"
license = "MIT OR Apache-2.0"

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.51", features = ["derive", "env"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
dirs-next = "2.0.0"
globset = "0.4.18"
ratatui = "0.29.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
similar = "2.7.0"
thiserror = "2.0.17"
tree-sitter = "0.25.10"
tree-sitter-highlight = "0.25.10"
tree-sitter-rust = "0.24.0"

[dev-dependencies]
insta = { version = "1.44.0", features = ["json"] }
tempfile = "3.23.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
