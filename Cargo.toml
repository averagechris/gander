[package]
name = "gander"
version = "0.8.2"
edition = "2024"
description = "Local-first jj review workspace with TUI, CLI, agent handoff, skills, and exportable artifacts"
license = "MIT OR Apache-2.0"
repository = "https://git.sr.ht/~averagechris/gander"
homepage = "https://git.sr.ht/~averagechris/gander"
readme = "README.md"
keywords = ["jj", "jujutsu", "code-review", "tui", "diff"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.5", features = ["derive", "env"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
globset = "0.4.20"
ratatui = "0.30.2"
rmcp = { version = "2.2.0", features = [
  "server",
  "macros",
  "transport-io",
  "schemars",
] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
similar = { version = "3.1.2", default-features = false, features = [
  "text",
  "unicode",
] }
# OSC 10/11 terminal color queries with DA1 fencing, bounded timeouts, and
# termios restoration on all paths; queried once before the crossterm event
# loop starts (src/tui/theme.rs).
terminal-colorsaurus = "1.0.3"
tokio = { version = "1.53.1", features = [
  "rt-multi-thread",
  "macros",
  "io-std",
  "net",
  "time",
] }
toml = "0.8.23"
tree-sitter = "0.25.10"
tree-sitter-bash = "0.25.1"
tree-sitter-css = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-highlight = "0.25.10"
tree-sitter-html = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-md = "0.5.3"
tree-sitter-nix = "0.3.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
uuid = { version = "1.24.0", features = ["v4"] }
wait-timeout = "0.2.1"

[dev-dependencies]
insta = { version = "1.48.0", features = ["json"] }
proptest = "1.11.0"
tempfile = "3.27.0"

[target.'cfg(unix)'.dev-dependencies]
# PTY plumbing for the production-path OSC 11 detection tests
# (src/tui/theme.rs pty_tests): openpty + TIOCSCTTY only.
libc = "0.2"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = "s"
panic = "abort"
