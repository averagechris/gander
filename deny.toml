[advisories]
ignore = []

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
# Axum 0.8.9 pulls this exact router release under MIT AND BSD-3-Clause.
# Keep BSD scoped here so a matchit upgrade or another BSD crate requires review.
exceptions = [{ crate = "matchit@0.8.4", allow = ["BSD-3-Clause"] }]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
