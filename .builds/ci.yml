image: nixos/unstable
arch: x86_64
environment:
  NIX_CONFIG: "experimental-features = nix-command flakes"
sources:
  - https://git.sr.ht/~averagechris/gander
tasks:
  - flake-check: |
      cd gander
      nix flake check --accept-flake-config
  - fmt: |
      cd gander
      nix run --accept-flake-config .#ci-fmt
  - clippy: |
      cd gander
      nix run --accept-flake-config .#ci-clippy
  - test: |
      cd gander
      nix run --accept-flake-config .#ci-test
